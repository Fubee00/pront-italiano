<title>Pronto Italiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App; oben das Heute-Ziel, unten feste Leiste mit 4 Bereichen */
:root{
  --bg:#f2f6f3; --surface:#ffffff; --ink:#14201b; --muted:#5a6a63; --line:#d7e1db;
  --accent:#0d7357; --accent-ink:#ffffff; --accent-soft:#dbeee5;
  --ok:#1d8749; --ok-soft:#e0f3e7; --bad:#c03f2b; --bad-soft:#fbe5df; --sun:#e8a317;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1613; --surface:#16211c; --ink:#e6eee9; --muted:#9bb0a6; --line:#29392f;
  --accent:#3fbf93; --accent-ink:#06130e; --accent-soft:#1c392d;
  --ok:#5fd18f; --ok-soft:#163425; --bad:#ff8a73; --bad-soft:#3c1e18; --sun:#f2b632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1613; --surface:#16211c; --ink:#e6eee9; --muted:#9bb0a6; --line:#29392f;
  --accent:#3fbf93; --accent-ink:#06130e; --accent-soft:#1c392d;
  --ok:#5fd18f; --ok-soft:#163425; --bad:#ff8a73; --bad-soft:#3c1e18; --sun:#f2b632; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.help{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.view{margin-top:18px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem}
.sec{font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.big{padding:20px;font-size:1.2rem;border-radius:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btns{display:flex;gap:10px}
.btns>*{flex:1}
:is(.btn,.chip,.play,.tab,.choice,.help,.seg button,.x):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Heute */
.goal{display:flex;align-items:center;gap:18px}
.ring{flex:0 0 auto;width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}
.goal .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.goal .txt b{font-size:1.15rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .card{padding:16px;gap:2px}
.stat{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.card.sotd{flex-direction:row;align-items:center;gap:12px}
.sotd .t{flex:1;min-width:0}
.banner{background:var(--accent-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
/* Karten */
.top{display:flex;align-items:center;gap:12px}
.top .bar{flex:1}
.x{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.flash{min-height:300px;justify-content:center;text-align:center;gap:16px;padding:28px 20px}
.flash .kind{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.flash .q{font-size:1.5rem;font-weight:700;line-height:1.3}
.flash hr{width:60px;border:0;border-top:2px solid var(--line);margin:0 auto}
.flash .a{font-size:1.5rem;font-weight:700;line-height:1.3;color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:.9rem}
.done{text-align:center;align-items:center;padding:32px 20px}
.done .em{font-size:3rem;line-height:1}
/* Listen */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:11px;border-radius:10px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=search]{width:100%;font:inherit;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 16px}
.row .t{flex:1;min-width:0}
.it{font-weight:700;font-size:1.08rem}
.de{color:var(--muted);font-size:.95rem}
.ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:8px;vertical-align:middle}
.play{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);cursor:pointer;display:grid;place-items:center}
.play svg{width:20px;height:20px}
.play.lg{width:60px;height:60px;margin:0 auto}
.play.lg svg{width:26px;height:26px}
/* Patienten */
.case{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.case .ic{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.4rem}
.case .t{flex:1;min-width:0;display:flex;flex-direction:column}
.case b{font-family:var(--f-display);font-size:1.1rem}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:16px;display:flex;align-items:center;gap:12px}
.bubble .t{flex:1;min-width:0}
.who{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.choice.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{border-radius:14px;padding:13px 15px;font-size:.95rem}
.fb.right{background:var(--ok-soft)} .fb.wrong{background:var(--bad-soft)}
/* Fortschritt */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted)}
.day.half{background:var(--accent-soft)}
.day.full{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.now{outline:2px solid var(--ink);outline-offset:1px}
.stage{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stage .st{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--accent-soft);color:var(--accent)}
.stage.done .st{background:var(--accent);color:var(--accent-ink)}
.stage.lock{opacity:.55}
.stage .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
/* Leiste */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{flex:1;min-width:0;max-width:150px;background:none;border:0;padding:11px 2px 13px;font:inherit;font-size:.78rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
/* Anleitung */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,16,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--surface);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:1.6rem}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.demo{border:2px dashed var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;width:max-content;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.flash,.sheet,.bubble,.done{animation:in .25s ease}@keyframes in{from{transform:translateY(6px);opacity:.4}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Pronto <span>Italiano</span></div>
    <button class="help" id="helpBtn">Anleitung</button>

</div>

</nav>

/* ---------- Speichern (doppelt: localStorage + IndexedDB) ---------- */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let idbP=null;
function idb(){if(!idbP)idbP=new Promise(r=>{try{const q=indexedDB.open("pronto-italiano",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);q.onblocked=()=>r(null)}catch(e){r(null)}});return idbP}
function idbPut(k,v){idb().then(d=>{if(!d)return;try{d.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){}})}
function idbAll(){return idb().then(d=>new Promise(r=>{if(!d)return r({});try{const out={},c=d.transaction("kv").objectStore("kv").openCursor();c.onsuccess=()=>{const x=c.result;if(x){out[x.key]=x.value;x.continue()}else r(out)};c.onerror=()=>r({})}catch(e){r({})}}))}
const store={get(k,d){const v=LS.get(k);if(v==null)return d;try{return JSON.parse(v)}catch(e){return d}},set(k,v){const s=JSON.stringify(v);LS.set(k,s);idbPut(k,s)}};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dkey(Date.now());
const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);

let prog=store.get("pi2-prog",{});           // {id:{b:Fach 1-5,t:zuletzt}}
let stats=store.get("pi2-stats",null);
if(!stats||!stats.days)stats={start:today(),goal:10,days:{}};
const saveStats=()=>store.set("pi2-stats",stats);
const bx=id=>(prog[id]&&prog[id].b)||1;
const sits=id=>bx(id)>=3;                    // "sitzt" = zweimal an verschiedenen Tagen gewusst
const todayCount=()=>stats.days[today()]||0;
const doneDay=k=>(stats.days[k]||0)>=stats.goal;
function streak(){let n=0,d=new Date();if(!doneDay(dkey(d)))d.setDate(d.getDate()-1);while(doneDay(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function tick(){const t=today();stats.days[t]=todayCount()+1;saveStats();if(stats.days[t]===stats.goal)toast("Tagesziel geschafft! 🎉 Brava!")}
const stageNeed=k=>Math.ceil(STAGES[k].ids.length*.8);
const stageHave=k=>STAGES[k].ids.filter(sits).length;
const stageDone=k=>stageHave(k)>=stageNeed(k);
function curStage(){let k=0;while(k<STAGES.length-1&&stageDone(k))k++;return k}
const pool=()=>STAGES.slice(0,curStage()+1).flatMap(s=>s.ids);

/* ---------- Kartenauswahl: was fällig ist zuerst, dann Neues ---------- */
const INT=[0,1,3,7,14]; // Tage Pause je Fach
const isDue=id=>{const r=prog[id];return !r||dayDiff(r.t,today())>=INT[r.b-1]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildSession(n){
  const pl=pool();
  let q=shuffle(pl.filter(id=>prog[id]&&isDue(id))).sort((a,b)=>bx(a)-bx(b)).slice(0,n);
  if(q.length<n)q=q.concat(pl.filter(id=>!prog[id]).slice(0,n-q.length));
  if(q.length<n)q=q.concat(shuffle(pl.filter(id=>!q.includes(id))).sort((a,b)=>bx(a)-bx(b)).slice(0,n-q.length));
  return q;
}

if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let ttsReady=false;
function unlockTTS(){if(ttsReady||!("speechSynthesis" in window))return;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);ttsReady=true}catch(e){}}
document.addEventListener("touchend",unlockTTS,{passive:true});

let hintShown=0;
function say(t){
  if(!("speechSynthesis" in window)){toast("Vorlesen geht in diesem Browser leider nicht.");return}
  const ss=speechSynthesis;if(!itVoice)pickVoice();
  const u=new SpeechSynthesisUtterance(t.replace(/\s\/\s/g,", "));
  u.lang="it-IT";u.rate=.85;u.volume=1;if(itVoice)u.voice=itVoice;
  let ok=false;u.onstart=()=>{ok=true};u.onend=()=>{ok=true};
  try{ss.resume()}catch(e){}
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(()=>ss.speak(u),120)}else ss.speak(u);
  setTimeout(()=>{if(!ok&&!ss.speaking&&Date.now()-hintShown>20000){hintShown=Date.now();toast("Kein Ton? Lautlos-Schalter am iPhone ausschalten und lauter drehen.")}},1800);
}

function vSession(){
  const n=sess.q.length;
  if(sess.i>=n){
    const tc=todayCount(),reached=tc>=stats.goal;
    app.innerHTML=`<div class="card done"><div class="em">${reached?"🎉":"👍"}</div><h1>${reached?"Brava!":"Runde fertig"}</h1>

  :`<p class="hint">Sag es zuerst laut. Dann aufdecken.</p><button class="btn big" id="show">Aufdecken</button>`}`;

  if($("#yes"))$("#yes").onclick=()=>answer(true);
  if($("#no"))$("#no").onclick=()=>answer(false);
}
function answer(knew){
  const id=sess.q[sess.i],before=curStage(),r=prog[id]||{b:1};
  prog[id]={b:knew?Math.min(5,r.b+1):1,t:today()};
  store.set("pi2-prog",prog);tick();
  if(knew)sess.ok++;else{sess.again++;if(!sess.re.has(id)){sess.re.add(id);sess.q.push(id)}}
  sess.i++;sess.shown=false;render();
  const after=curStage();if(after>before)setTimeout(()=>toast(`Neue Stufe frei: ${STAGES[after].n} 🎉`),900);
}

  <p class="note">Grüner Punkt = sitzt schon. ${sType==="s"?"Bei „/“ steht zuerst die Form für Männer, dann für Frauen. „Lei“ ist die höfliche Sie-Form.":""}</p>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{sType=b.dataset.t;sQ="";sCat="";vSuch()});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{sCat=b.dataset.c;sQ="";vSuch()});
  $("#q").oninput=e=>{sQ=e.target.value;list()};
  list();
}
function list(){
  const s=sQ.trim().toLowerCase();
  const items=CARDS.filter(c=>c.kind===sType&&(s?(c.it+" "+c.de).toLowerCase().includes(s):(sCat==="top"?c.top:c.cat===sCat)));
  const l=document.getElementById("l");
  l.innerHTML=items.length?items.map(c=>`<div class="row"><div class="t"><div class="it">${esc(c.it)}${sits(c.id)?'<span class="ok-dot" title="sitzt"></span>':""}</div><div class="de">${esc(c.de)}</div></div><button class="play" data-id="${c.id}" aria-label="Vorlesen">${playIcon}</button></div>`).join(""):`<p class="note">Nichts gefunden.</p>`;
  l.querySelectorAll(".play").forEach(b=>b.onclick=()=>say(C[b.dataset.id].it));
}

/* ---------- PATIENTEN ---------- */
let ci=null,si=0,choice=null,showDe=false,score=0;
function vFaelle(){
  if(ci===null){
    app.innerHTML=`<h1>Patienten</h1><p class="sub">Ein Patient spricht Italienisch. Du wählst, was du als Nächstes sagst. Jede Antwort zählt fürs Tagesziel.</p>`+
      CASES.map((c,i)=>`<button class="case" data-c="${i}"><span class="ic">${CASE_IC[i]||"🩺"}</span><span class="t"><b>${esc(c.t)}</b><span class="de">${esc(c.s)} · ${c.steps.length} Schritte</span></span></button>`).join("");
    app.querySelectorAll(".case").forEach(b=>b.onclick=()=>{ci=+b.dataset.c;si=0;choice=null;showDe=false;score=0;vFaelle();say(CASES[ci].steps[0].p)});
    return;
  }
  const c=CASES[ci];
  if(si>=c.steps.length){
    app.innerHTML=`<div class="card done"><div class="em">${score===c.steps.length?"🌟":"👍"}</div><h1>Fall geschafft</h1><p class="sub">${score} von ${c.steps.length} beim ersten Versuch richtig.</p></div>
    <button class="btn big" id="back">Alle Patienten</button><button class="btn ghost" id="again">Nochmal spielen</button>`;
    $("#back").onclick=()=>{ci=null;vFaelle()};
    $("#again").onclick=()=>{si=0;choice=null;score=0;vFaelle();say(c.steps[0].p)};
    return;
  }
  const s=c.steps[si];
  app.innerHTML=`<div class="top"><button class="x" id="ex" aria-label="Fall beenden">×</button><div class="bar"><i style="width:${si/c.steps.length*100}%"></i></div><span class="count">${si+1} / ${c.steps.length}</span></div>
  <p class="note">${esc(c.t)} · ${esc(c.s)}</p>
  <div class="bubble"><div class="t"><div class="who">Patient sagt</div><div class="it">${esc(s.p)}</div>${showDe?`<div class="de">${esc(s.d)}</div>`:`<button class="link" id="rd">Auf Deutsch zeigen</button>`}</div><button class="play" id="pp" aria-label="Vorlesen">${playIcon}</button></div>
  <p class="sec">Was sagst du?</p>
  ${s.c.map((t,i)=>`<button class="choice ${choice===null?"":i===s.r?"right":i===choice?"wrong":""}" data-k="${i}">${esc(t)}</button>`).join("")}
  ${choice!==null?`<div class="fb ${choice===s.r?"right":"wrong"}"><b>${choice===s.r?"Richtig!":"Nicht ganz."}</b> ${esc(s.w)}</div><button class="btn big" id="nx">Weiter</button>`:""}`;
  $("#pp").onclick=()=>say(s.p);
  $("#ex").onclick=()=>{ci=null;vFaelle()};
  if($("#rd"))$("#rd").onclick=()=>{showDe=true;vFaelle()};
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(choice!==null)return;choice=+b.dataset.k;if(choice===s.r)score++;tick();say(s.c[s.r]);vFaelle()});
  if($("#nx"))$("#nx").onclick=()=>{si++;choice=null;showDe=false;vFaelle();if(si<c.steps.length)say(c.steps[si].p)};
}

/* ---------- FORTSCHRITT ---------- */
function vFort(){
  const st=streak(),k=curStage(),all=CARDS.filter(c=>sits(c.id)).length;
  const cells=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=dkey(d),n=stats.days[key]||0;cells.push(`<div class="day ${n>=stats.goal?"full":n>0?"half":""} ${i===0?"now":""}" title="${key}: ${n} Karten">${"SMDMDFS"[d.getDay()]}</div>`)}
  app.innerHTML=`<h1>Fortschritt</h1>
  <div class="pair">
    <div class="card"><div class="stat">🔥 ${st}</div><div class="note">${st===1?"Tag":"Tage"} in Folge geschafft</div></div>
    <div class="card"><div class="stat">${all}</div><div class="note">Sätze & Wörter sitzen</div></div>
  </div>
  <p class="sec">Letzte 2 Wochen</p>
  <div class="days">${cells.join("")}</div>
  <p class="note">Grün = Tagesziel geschafft · hell = angefangen</p>
  <p class="sec">Stufen</p>
  ${STAGES.map((S,i)=>{const done=i<k||(i===k&&stageDone(i)),lock=i>k,h=stageHave(i),nd=stageNeed(i);
    return `<div class="stage ${done?"done":""} ${lock?"lock":""}"><div class="st">${done?"✓":lock?"🔒":i+1}</div><div class="t"><b>${esc(S.n)}</b><span class="note">${esc(S.d)}</span>${lock?"":`<div class="bar"><i style="width:${Math.min(100,h/nd*100)}%"></i></div><span class="note">${h} von ${nd} sitzen${done?" ✓":""}</span>`}</div></div>`}).join("")}
  <p class="sec">Tagesziel</p>
  <div class="chips">${[5,10,20].map(n=>`<button class="chip" data-g="${n}" aria-pressed="${stats.goal===n}">${n} Karten${n===5?" · locker":n===10?" · normal":" · fleißig"}</button>`).join("")}</div>
  <p class="note">Dabei seit ${stats.start.split("-").reverse().join(".")}. Eine Karte „sitzt“, wenn du sie an zwei verschiedenen Tagen gewusst hast.</p>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{stats.goal=+b.dataset.g;saveStats();vFort()});
}

/* ---------- Navigation ---------- */
const views={heute:vHeute,such:vSuch,faelle:vFaelle,fort:vFort};
let curView="heute";
function render(){views[curView]()}
function go(v){curView=v;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
go("heute");

/* ---------- Anleitung ---------- */
const TUT=[
 {h:"Hallo Mutti! 👋",b:`<p>Fabian hat dir diese App gebaut, damit du die wichtigsten Sätze für die Notaufnahme wieder auffrischen kannst.</p><p>Das Wichtigste vorweg: <b>Du musst nur einen Knopf drücken.</b> Die App sucht selbst aus, was du üben sollst.</p>`},
 {h:"Jeden Tag: „Jetzt üben“",t:"heute",b:`<p>Auf <b>Heute</b> drückst du den großen Knopf. Dann kommen 10 Karten. Probier's mit dieser:</p>
  <div class="demo"><span class="note">Wie sagst du auf Italienisch:</span><b style="font-size:1.25rem">Wie heißen Sie?</b><div id="d1"><p class="note">Sag es zuerst laut. Dann:</p></div><button class="btn" id="d1b">Aufdecken</button></div>
  <p id="d1t" class="note">Danach drückst du <b>Gewusst</b> oder <b>Nochmal</b>. Was du weißt, kommt seltener. Was hakt, kommt öfter.</p>`,
  wire(ov){ov.querySelector("#d1b").onclick=()=>{say("Come si chiama?");ov.querySelector("#d1").innerHTML=`<b style="font-size:1.25rem;color:var(--accent)">Come si chiama?</b>`;ov.querySelector("#d1b").remove();ov.querySelector("#d1t").innerHTML="Hast du gehört? So klingt's. Jetzt würdest du <b>Gewusst</b> oder <b>Nochmal</b> drücken. 👍"}}},
 {h:"Der Ring zeigt dein Ziel",t:"heute",b:`<ul><li>Der <b>grüne Ring</b> füllt sich mit jeder Karte. Ist er voll, bist du für heute fertig.</li><li>🔥 zählt, wie viele Tage <b>in Folge</b> du es geschafft hast.</li><li>Du fängst mit den <b>30 wichtigsten Sätzen</b> an. Sitzen die, kommt automatisch die nächste Stufe dazu.</li></ul>`},
 {h:"Noch mehr, wenn du willst",t:"faelle",b:`<ul><li><b>Patienten:</b> Ein Patient spricht Italienisch, du wählst die passende Frage. Wie ein kleines Rollenspiel.</li><li><b>Nachschlagen:</b> Alle Sätze und Wörter zum Anhören. Gut, wenn du in der Arbeit schnell was brauchst.</li><li><b>Fortschritt:</b> Kalender, Stufen und dein Tagesziel (5, 10 oder 20 Karten).</li></ul>`},
 {h:"Zwei Tipps",t:"heute",b:`<ul><li><b>Kein Ton?</b> Den Lautlos-Schalter am iPhone ausschalten und lauter drehen.</li><li><b>Öffne die App immer übers Icon</b> am Home-Bildschirm. Nur dann bleibt dein Fortschritt gespeichert.</li></ul><p>Die Anleitung findest du jederzeit oben rechts. In bocca al lupo! 🍀</p>`,last:1}
];
let ti=0;
function tut(){
  const s=TUT[ti];if(s.t&&!sess)go(s.t);
  let ov=document.getElementById("ov");
  if(!ov){ov=document.createElement("div");ov.id="ov";ov.className="ov";document.body.appendChild(ov)}
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><span class="note">Schritt ${ti+1} von ${TUT.length}</span><h2>${s.h}</h2>${s.b}<div class="dots">${TUT.map((x,i)=>`<span class="dot ${i===ti?"on":""}"></span>`).join("")}</div><div class="btns">${ti>0?`<button class="btn ghost" id="tb">Zurück</button>`:`<button class="btn ghost" id="tx">Überspringen</button>`}<button class="btn" id="tn">${s.last?"Los geht's!":"Weiter"}</button></div></div>`;
  ov.querySelector(".sheet").scrollTop=0;
  if(s.wire)s.wire(ov);
  const close=()=>{ov.remove();store.set("pi2-tut",1);go("heute")};
  ov.querySelector("#tn").onclick=()=>{if(s.last)close();else{ti++;tut()}};
  const b=ov.querySelector("#tb");if(b)b.onclick=()=>{ti--;tut()};
  const x=ov.querySelector("#tx");if(x)x.onclick=close;
}
document.getElementById("helpBtn").onclick=()=>{ti=0;tut()};

/* ---------- Gesicherte Daten zurückholen ---------- */
idbAll().then(all=>{
  let changed=false;
  for(const k of ["pi2-prog","pi2-tut","pi2-stats"]){
    const l=LS.get(k),b=all[k];
    if(l==null&&b!=null){LS.set(k,b);changed=true}else if(l!=null&&b==null)idbPut(k,l);
  }
  try{
    if(all["pi2-stats"]&&LS.get("pi2-stats")){
      const a=JSON.parse(all["pi2-stats"]),c=JSON.parse(LS.get("pi2-stats"));let m=false;
      for(const d in (a.days||{}))if((a.days[d]||0)>(c.days[d]||0)){c.days[d]=a.days[d];m=true}
      if(a.start&&a.start<c.start){c.start=a.start;m=true}
      if(m){store.set("pi2-stats",c);changed=true}
    }
  }catch(e){}
  if(changed){prog=store.get("pi2-prog",{});const s=store.get("pi2-stats",null);if(s&&s.days)stats=s;if(!sess&&!document.getElementById("ov"))render()}
  if(LS.get("pi2-stats")==null)saveStats();
});
</script>
