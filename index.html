/* Speicher */
/* Doppelt speichern: localStorage + IndexedDB, damit iPhones nichts verlieren */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let idbP=null;
function idb(){if(!idbP)idbP=new Promise(r=>{try{const q=indexedDB.open("pronto-italiano",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);q.onblocked=()=>r(null)}catch(e){r(null)}});return idbP}
function idbPut(k,v){idb().then(d=>{if(!d)return;try{d.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){}})}
function idbAll(){return idb().then(d=>new Promise(r=>{if(!d)return r({});try{const out={},c=d.transaction("kv").objectStore("kv").openCursor();c.onsuccess=()=>{const x=c.result;if(x){out[x.key]=x.value;x.continue()}else r(out)};c.onerror=()=>r({})}catch(e){r({})}}))}
const store={get(k,d){const v=LS.get(k);if(v==null)return d;try{return JSON.parse(v)}catch(e){return d}},set(k,v){const s=JSON.stringify(v);LS.set(k,s);idbPut(k,s)}};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
let boxes=store.get("pi-boxes",{});
let vboxes=store.get("pi-vboxes",{});
const vbox=i=>vboxes[i]||1;

/* Tagesziel und Serie */
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dkey(Date.now());
let stats=store.get("pi-stats",null);
if(!stats||!stats.days){stats={start:today(),goal:10,days:{}}}
function saveStats(){store.set("pi-stats",stats)}
function tick(){const t=today();stats.days[t]=(stats.days[t]||0)+1;saveStats();if(stats.days[t]===stats.goal)toast("Tagesziel geschafft! 🎉 Brava!")}
const done=k=>(stats.days[k]||0)>=stats.goal;
function streak(){let n=0,d=new Date();if(!done(dkey(d)))d.setDate(d.getDate()-1);while(done(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function daysSince(){const a=new Date(stats.start+"T12:00:00"),b=new Date(today()+"T12:00:00");return Math.round((b-a)/864e5)}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const TOP=P.map((p,i)=>i).filter(i=>P[i][3]);

/* Vorlesen */
let itVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();itVoice=vs.find(v=>/^it/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
/* iOS: Sprachausgabe beim ersten Antippen freischalten */
let ttsReady=false;
function unlockTTS(){if(ttsReady||!("speechSynthesis" in window))return;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);ttsReady=true}catch(e){}}
document.addEventListener("touchend",unlockTTS,{passive:true});
document.addEventListener("click",unlockTTS);
let hintShown=0;
function say(t){
  if(!("speechSynthesis" in window)){toast("Vorlesen geht in diesem Browser leider nicht.");return}
  const ss=speechSynthesis;
  if(!itVoice)pickVoice();
  const u=new SpeechSynthesisUtterance(t.replace(/\s\/\s/g,", "));
  u.lang="it-IT";u.rate=.85;u.volume=1;if(itVoice)u.voice=itVoice;
  let ok=false;u.onstart=()=>{ok=true};u.onend=()=>{ok=true};
  try{ss.resume()}catch(e){}
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(()=>ss.speak(u),120)}else ss.speak(u);
  setTimeout(()=>{if(!ok&&!ss.speaking&&Date.now()-hintShown>20000){hintShown=Date.now();toast("Kein Ton? Lautlos-Schalter am iPhone ausschalten und lauter drehen.")}},1800);
}

/* Ansicht: Vokabeln */
let vcat="vk",vmode="liste",vq="",vcur=null,vshown=false;
function vdeck(){return V.map((v,i)=>i).filter(i=>V[i][2]===vcat)}
function vnext(){const d=vdeck();let min=6;d.forEach(i=>{if(vbox(i)<min)min=vbox(i)});let pool=d.filter(i=>vbox(i)===min);if(pool.length>1)pool=pool.filter(i=>i!==vcur);vcur=pool[Math.floor(Math.random()*pool.length)];vshown=false}
function vVok(){
  const chips=Object.entries(VCATS).map(([k,l])=>`<button class="chip" data-vc="${k}" aria-pressed="${vcat===k}">${l}</button>`).join("");
  const modes=`<div class="seg"><button data-m="liste" aria-pressed="${vmode==="liste"}">Liste</button><button data-m="abfragen" aria-pressed="${vmode==="abfragen"}">Abfragen</button></div>`;
  let body;
  if(vmode==="liste"){
    body=`<input type="search" id="vq" placeholder="Wort suchen, z. B. Knie oder gamba" value="${esc(vq)}"><div class="list" id="vl"></div>`;
  }else{
    if(vcur===null||!vdeck().includes(vcur))vnext();
    const v=V[vcur],d=vdeck(),sit=d.filter(i=>vbox(i)>=4).length,tc=stats.days[today()]||0;
    body=`<div class="meta"><span>Heute: <b>${tc} von ${stats.goal}</b></span><span>${sit} von ${d.length} Wörtern sitzen</span></div>
    <div class="card flash"><div class="meta"><span>${VCATS[v[2]]}</span><span>Fach ${vbox(vcur)}</span></div><div class="q">${esc(v[1])}</div>${vshown?`<div class="a">${esc(v[0])}</div><div><button class="play" id="vsp" aria-label="Vorlesen" style="margin:0 auto">${playIcon}</button></div>`:`<p class="note">Wie heißt das auf Italienisch? Laut sagen, dann aufdecken.</p>`}</div>
    ${vshown?`<div class="btns"><button class="btn bad" id="vno">Nochmal</button><button class="btn ok" id="vyes">Gewusst</button></div>`:`<div class="btns"><button class="btn" id="vshow">Aufdecken</button></div>`}
    <p class="note">Jedes abgefragte Wort zählt fürs Tagesziel.</p>`;
  }
  app.innerHTML=modes+`<div class="chips">${chips}</div>`+body;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{vmode=b.dataset.m;vcur=null;vVok()});
  app.querySelectorAll("[data-vc]").forEach(b=>b.onclick=()=>{vcat=b.dataset.vc;vq="";vcur=null;vVok()});
  const g=id=>app.querySelector("#"+id);
  if(vmode==="liste"){renderVList();g("vq").oninput=e=>{vq=e.target.value;renderVList()};return}
  const v=V[vcur];
  if(g("vshow"))g("vshow").onclick=()=>{vshown=true;vVok();say(v[0])};
  if(g("vsp"))g("vsp").onclick=()=>say(v[0]);
  if(g("vyes"))g("vyes").onclick=()=>{vboxes[vcur]=Math.min(5,vbox(vcur)+1);store.set("pi-vboxes",vboxes);tick();vnext();vVok()};
  if(g("vno"))g("vno").onclick=()=>{vboxes[vcur]=1;store.set("pi-vboxes",vboxes);tick();vnext();vVok()};
}
function renderVList(){
  const s=vq.trim().toLowerCase();

function renderList(){

}

/* Ansicht: Üben (Lernkartei, 5 Fächer) */
let set="top",cur=null,shown=false,dir="de";
function deck(){return P.map((p,i)=>i).filter(i=>set==="top"?P[i][3]:set==="all"?true:P[i][2]===set)}
function next(){
  const d=deck();let min=6;d.forEach(i=>{if(box(i)<min)min=box(i)});
  let pool=d.filter(i=>box(i)===min);if(pool.length>1)pool=pool.filter(i=>i!==cur);
  cur=pool[Math.floor(Math.random()*pool.length)];shown=false;
}
function vUeben(){
  if(cur===null||!deck().includes(cur))next();
  const d=deck(),cnt=[1,2,3,4,5].map(n=>d.filter(i=>box(i)===n).length);
  const p=P[cur];const front=dir==="de"?p[1]:p[0],back=dir==="de"?p[0]:p[1];
  const opts=[["top","★ Top 30"],["all","Alle"],...Object.entries(CATS)].map(([k,l])=>`<button class="chip" data-s="${k}" aria-pressed="${set===k}">${l}</button>`).join("");
  const tc=stats.days[today()]||0;
  app.innerHTML=`<div class="todaybar"><div class="meta"><span>Heute: <b>${tc} von ${stats.goal}</b> Karten</span><span>${tc>=stats.goal?"✅ geschafft":"noch "+(stats.goal-tc)}</span></div><div class="bar"><i style="width:${Math.min(100,tc/stats.goal*100)}%"></i></div></div><div class="chips">${opts}</div>
  <div class="boxes">${cnt.map((c,n)=>`<div class="box"><b>${c}</b>Fach ${n+1}</div>`).join("")}</div>
  <div class="card flash">
    <div class="meta"><span>${CATS[p[2]]}</span><span>Fach ${box(cur)}</span></div>
    <div class="q">${esc(front)}</div>
    ${shown?`<div class="a">${esc(back)}</div><div><button class="play" id="sp" aria-label="Vorlesen" style="margin:0 auto">${playIcon}</button></div>`:`<p class="note">${dir==="de"?"Wie sagt man das auf Italienisch? Laut aussprechen, dann aufdecken.":"Was heißt das? Dann aufdecken."}</p>`}
  </div>
  ${shown?`<div class="btns"><button class="btn bad" id="no">Nochmal</button><button class="btn ok" id="yes">Gewusst</button></div>`:`<div class="btns"><button class="btn" id="show">Aufdecken</button></div>`}
  <button class="btn ghost" id="dir">Richtung: ${dir==="de"?"Deutsch → Italienisch":"Italienisch → Deutsch"}</button>
  <p class="note">Gewusst wandert ein Fach weiter, Nochmal zurück in Fach 1. Was hakt, kommt öfter dran. Der Fortschritt bleibt auf diesem Handy gespeichert.</p>`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{set=b.dataset.s;cur=null;vUeben()});
  const g=id=>app.querySelector("#"+id);
  if(g("show"))g("show").onclick=()=>{shown=true;vUeben();say(p[0])};
  if(g("sp"))g("sp").onclick=()=>say(p[0]);
  if(g("yes"))g("yes").onclick=()=>{boxes[cur]=Math.min(5,box(cur)+1);store.set("pi-boxes",boxes);tick();next();vUeben()};
  if(g("no"))g("no").onclick=()=>{boxes[cur]=1;store.set("pi-boxes",boxes);tick();next();vUeben()};
  g("dir").onclick=()=>{dir=dir==="de"?"it":"de";shown=false;vUeben()};
}

/* Ansicht: Patienten-Fälle */
let ci=null,si=0,pick=null,showDe=false,score=0;
function vFaelle(){
  if(ci===null){
    app.innerHTML=`<p class="note">Der Patient sagt etwas auf Italienisch. Du wählst, was du als Nächstes sagst.</p>`+CASES.map((c,i)=>`<button class="case" data-c="${i}"><span class="t">${c.t}</span><span class="de">${c.s} · ${c.steps.length} Schritte</span></button>`).join("");
    app.querySelectorAll(".case").forEach(b=>b.onclick=()=>{ci=+b.dataset.c;si=0;pick=null;showDe=false;score=0;vFaelle();say(CASES[ci].steps[0].p)});
    return;
  }
  const c=CASES[ci];
  if(si>=c.steps.length){
    app.innerHTML=`<div class="card"><div class="t" style="font-family:var(--f-display);font-weight:800;font-size:1.5rem">Fall geschafft</div><p>${score} von ${c.steps.length} beim ersten Versuch richtig.</p></div><div class="btns"><button class="btn ghost" id="back">Alle Fälle</button><button class="btn" id="again">Nochmal</button></div>`;
    app.querySelector("#back").onclick=()=>{ci=null;vFaelle()};
    app.querySelector("#again").onclick=()=>{si=0;pick=null;score=0;vFaelle();say(c.steps[0].p)};
    return;
  }
  const s=c.steps[si];
  app.innerHTML=`<div class="meta"><span>${c.t}</span><span>Schritt ${si+1} / ${c.steps.length}</span></div>
  <div class="bubble"><div class="who">Patient</div><div class="row" style="border:0;padding:0;background:none"><div class="txt"><div class="it">${esc(s.p)}</div>${showDe?`<div class="de">${esc(s.d)}</div>`:`<button class="reveal" id="rd">Auf Deutsch zeigen</button>`}</div><button class="play" id="pp" aria-label="Vorlesen">${playIcon}</button></div></div>
  <p class="sec">Was sagst du?</p>
  ${s.c.map((t,i)=>`<button class="choice ${pick===null?"":i===s.r?"right":i===pick?"wrong":""}" data-k="${i}">${esc(t)}</button>`).join("")}
  ${pick!==null?`<div class="fb ${pick===s.r?"right":"wrong"}">${pick===s.r?"Richtig. ":"Nicht ganz. "}${esc(s.w)}</div><button class="btn" id="nx">Weiter</button>`:""}
  <button class="btn ghost" id="ex">Fall beenden</button>`;
  const g=id=>app.querySelector("#"+id);
  g("pp").onclick=()=>say(s.p);
  if(g("rd"))g("rd").onclick=()=>{showDe=true;vFaelle()};
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(pick!==null)return;pick=+b.dataset.k;if(pick===s.r)score++;tick();say(s.c[s.r]);vFaelle()});
  if(g("nx"))g("nx").onclick=()=>{si++;pick=null;showDe=false;vFaelle();if(si<c.steps.length)say(c.steps[si].p)};
  g("ex").onclick=()=>{ci=null;vFaelle()};
}

  else check=`<div class="fb wrong"><b>2-Wochen-Check: Mehr Routine wär gut.</b> Lieber jeden Tag 5 Karten als selten viele. Stell das Tagesziel ruhig auf 5.</div>`;
  app.innerHTML=`

  </div>
  <div class="stats2">
    <div class="card"><div class="big">🔥 ${st}</div><div class="note">${st===1?"Tag":"Tage"} in Folge</div></div>
    <div class="card"><div class="big">${sit}<small>/${TOP.length}</small></div><div class="note">Top-Sätze sitzen (Fach 4–5)</div></div>
  </div>
  <p class="sec">Letzte 14 Tage</p>
  <div class="days">${cells.join("")}</div>
  <p class="note">Grün = Tagesziel geschafft, hell = angefangen.</p>
  <p class="sec">Diese Woche (Woche ${week})</p>
  <div class="card"><p style="margin:0">${plan}</p></div>
  ${check}
  <p class="sec">Endziel</p>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><p style="margin:0">Alle Top 30 in Fach 4 oder 5.</p><div class="bar"><i style="width:${sit/TOP.length*100}%"></i></div></div>
  <p class="sec">Tagesziel ändern</p>
  <div class="chips">${[5,10,20].map(n=>`<button class="chip" data-g="${n}" aria-pressed="${stats.goal===n}">${n} Karten${n===5?" (locker)":n===10?" (normal)":" (fleißig)"}</button>`).join("")}</div>
  <p class="note">Dabei seit <b>${stats.start.split("-").reverse().join(".")}</b>. Steht hier immer das heutige Datum, obwohl du schon länger übst, speichert das Handy nicht. Dann sag Fabian Bescheid.</p>`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{stats.goal=+b.dataset.g;saveStats();vZiel()});
}

/* Tabs */
const views={saetze:vSaetze,vok:vVok,ueben:vUeben,faelle:vFaelle,ziel:vZiel};
function go(v){curView=v;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));LS.set("pi-tab",JSON.stringify(v));views[v]();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
const startTab=store.get("pi-tab","saetze");go(views[startTab]?startTab:"saetze");

/* Anleitung mit Mitmach-Beispielen */
const TUT=[
 {h:"Hallo Mutti! 👋",b:`<p>Fabian hat dir diese kleine App gebaut, damit du die wichtigsten Sätze für die Notaufnahme wieder auffrischen kannst.</p><p>Wir gehen das jetzt <b>gemeinsam an einem Beispiel</b> durch: am Satz <b>„Wie heißen Sie?“</b>. Du kannst auf alles direkt tippen und es ausprobieren.</p>`},
 {h:"1. Anhören und nachsprechen",t:"saetze",b:`<p>So sieht ein Satz in der App aus. <b>Tipp auf den grünen Knopf</b>, das Handy liest ihn vor:</p>
  <div class="demo"><div class="row"><div class="txt"><div class="it">Come si chiama?</div><div class="de">Wie heißen Sie?</div></div><button class="play" id="d1" aria-label="Vorlesen">${playIcon}</button></div></div>
  <p id="d1t" class="note">Noch nicht angetippt.</p>
  <p>Jetzt <b>sag es laut nach</b>: „KO-me si KJA-ma?“ Ruhig zwei-, dreimal. Genau so gehst du später alle Sätze durch.</p>`,
  wire(ov){ov.querySelector("#d1").onclick=()=>{say("Come si chiama?");ov.querySelector("#d1t").innerHTML="Super! 👍 Und jetzt laut nachsprechen."}}},
 {h:"2. Selber draufkommen",t:"ueben",b:`<p>Beim <b>Üben</b> siehst du nur den deutschen Satz. Probier's:</p>
  <div class="demo card flash" style="min-height:0;padding:18px"><div class="q">Wie heißen Sie?</div><div id="d2a"><p class="note">Sag es zuerst laut auf Italienisch. Dann:</p></div></div>
  <div class="btns" id="d2b"><button class="btn" id="d2show">Aufdecken</button></div>
  <p id="d2t" class="note"></p>`,
  wire(ov){
   ov.querySelector("#d2show").onclick=()=>{say("Come si chiama?");
    ov.querySelector("#d2a").innerHTML=`<div class="a">Come si chiama?</div>`;
    ov.querySelector("#d2b").innerHTML=`<button class="btn bad" id="d2no">Nochmal</button><button class="btn ok" id="d2yes">Gewusst</button>`;
    ov.querySelector("#d2t").innerHTML="Hast du's gewusst? Sei ehrlich zu dir 😉";
    ov.querySelector("#d2no").onclick=()=>{ov.querySelector("#d2t").innerHTML="Kein Problem! Der Satz kommt jetzt <b>bald wieder</b> dran, bis er sitzt."};
    ov.querySelector("#d2yes").onclick=()=>{ov.querySelector("#d2t").innerHTML="Bravissima! Der Satz wandert ins <b>nächste Fach</b> und kommt seltener. Ab Fach 4–5 sitzt er."};
   }}},
 {h:"3. Mit dem Patienten reden",t:"faelle",b:`<p>Bei <b>Patienten</b> spielst du echte Situationen. Ein Patient kommt rein und sagt:</p>
  <div class="demo bubble"><div class="who">Patient</div><div class="it">Buongiorno, mi fa male la testa.</div><div class="de">Guten Tag, mir tut der Kopf weh.</div></div>
  <p><b>Was sagst du zuerst?</b> Tipp eine Antwort an:</p>
  <div class="list" id="d3">
   <button class="choice" data-k="0">Il bagno è lì.</button>
   <button class="choice" data-k="1">Come si chiama?</button>
   <button class="choice" data-k="2">Trattenga il respiro.</button>
  </div>
  <div id="d3t"></div>`,
  wire(ov){ov.querySelectorAll("#d3 .choice").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;ov.querySelectorAll("#d3 .choice").forEach(x=>x.className="choice"+(+x.dataset.k===1?" right":+x.dataset.k===k?" wrong":""));
   say("Come si chiama?");
   ov.querySelector("#d3t").innerHTML=k===1?`<div class="fb right">Genau! Erst nach dem Namen fragen. Danach ginge es weiter mit „Da quando ha dolore?“ (Seit wann?).</div>`:`<div class="fb wrong">Nicht ganz. „${k===0?"Die Toilette ist dort":"Halten Sie die Luft an"}“ passt hier nicht. Zuerst fragst du nach dem Namen: „Come si chiama?“</div>`;
  })}},
 {h:"So schaut ein Lerntag aus",b:`<p>Ein Beispiel, ganz konkret:</p>
  <ul>
   <li>☕ <b>Beim Kaffee in der Früh, 10 Minuten:</b> 5 Sätze aus „★ Top 30“ anhören und je dreimal laut nachsprechen.</li>
   <li>🗂️ <b>Danach 5 Minuten Üben:</b> die Karten durchgehen, bis alle einmal dran waren.</li>
   <li>🏥 <b>In der Arbeit:</b> einen Satz davon wirklich sagen, zum Beispiel „Buongiorno, come si chiama?“</li>
   <li>🩺 <b>Zwei-, dreimal pro Woche:</b> einen Patienten-Fall spielen.</li>
  </ul>
  <p>🎯 Unter <b>Ziel</b> siehst du dein <b>Tagesziel</b> (10 Karten), wie viele Tage du schon <b>in Folge</b> dabei bist und was <b>diese Woche</b> dran ist. Ist das Ziel geschafft, bist du für heute fertig.</p>
  <p><b>Woche 1–2:</b> nur die Top 30. <b>Ab Woche 3:</b> jede Woche eine Kategorie dazu, zuerst „Beschwerden“.</p>
  <p class="note">Lieber 5 Sätze, die sitzen, als 20 auf einmal.</p>`},
 {h:"Noch ein paar Tipps",b:`<ul><li>Bei <b>Vokabeln</b> findest du einzelne Wörter wie Körperteile, Zahlen oder Material. Mit <b>Abfragen</b> übst du sie wie Karteikarten.</li><li>Im Browser auf <b>„Zum Home-Bildschirm“</b> tippen, dann hast du die App wie jede andere am Handy.</li><li><b>Öffne die App danach immer über dieses Icon</b>, nicht mehr über den WhatsApp-Link. Das iPhone speichert deinen Fortschritt für Icon und Browser getrennt.</li><li>Ist das Vorlesen stumm oder klingt komisch? Dann in den Handy-Einstellungen bei <b>Sprachausgabe</b> die italienische Stimme laden.</li></ul><p>Die Anleitung findest du jederzeit oben rechts. In bocca al lupo! 🍀</p>`,last:1}
];
let ti=0;
function tut(){
  const s=TUT[ti];if(s.t)go(s.t);
  let ov=document.getElementById("ov");
  if(!ov){ov=document.createElement("div");ov.id="ov";ov.className="ov";document.body.appendChild(ov)}
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><span class="step">Schritt ${ti+1} von ${TUT.length}</span><h2>${s.h}</h2>${s.b}<div class="dots">${TUT.map((x,i)=>`<span class="dot ${i===ti?"on":""}"></span>`).join("")}</div><div class="btns">${ti>0?`<button class="btn ghost" id="tb">Zurück</button>`:`<button class="btn ghost" id="tx">Überspringen</button>`}<button class="btn" id="tn">${s.last?"Andiamo! Los geht's":"Weiter"}</button></div></div>`;
  ov.querySelector(".sheet").scrollTop=0;
  if(s.wire)s.wire(ov);
  const close=()=>{ov.remove();store.set("pi-tut",1);go("saetze")};
  ov.querySelector("#tn").onclick=()=>{if(s.last)close();else{ti++;tut()}};
  const b=ov.querySelector("#tb");if(b)b.onclick=()=>{ti--;tut()};
  const x=ov.querySelector("#tx");if(x)x.onclick=close;
}
document.getElementById("helpBtn").onclick=()=>{ti=0;tut()};

/* Gesicherte Daten zurückholen, falls der normale Speicher leer ist */
idbAll().then(all=>{
  let changed=false;
  for(const k of ["pi-boxes","pi-vboxes","pi-tut","pi-stats"]){
    const l=LS.get(k),b=all[k];
    if(l==null&&b!=null){LS.set(k,b);changed=true}
    else if(l!=null&&b==null)idbPut(k,l);
  }
  try{
    if(all["pi-stats"]&&LS.get("pi-stats")){
      const a=JSON.parse(all["pi-stats"]),c=JSON.parse(LS.get("pi-stats"));let m=false;
      for(const d in (a.days||{}))if((a.days[d]||0)>(c.days[d]||0)){c.days[d]=a.days[d];m=true}
      if(a.start&&a.start<c.start){c.start=a.start;m=true}
      if(m){store.set("pi-stats",c);changed=true}
    }
  }catch(e){}
  if(changed){boxes=store.get("pi-boxes",{});vboxes=store.get("pi-vboxes",{});const s=store.get("pi-stats",null);if(s&&s.days)stats=s;if(!document.getElementById("ov"))views[curView]()}
  if(LS.get("pi-stats")==null)saveStats();
});
</script>
